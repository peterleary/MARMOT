name: Build MARMOT GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_name: MARMOT-macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: marmot-gui-linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: marmot-gui-windows-x86_64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      # macOS: build .app bundle only (no DMG — unsigned DMGs are blocked by Gatekeeper)
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        working-directory: tauri-app
        run: npx tauri build --target ${{ matrix.target }} --bundles app

      - name: Re-sign and package .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          xattr -cr MARMOT.app
          codesign --force --deep -s - MARMOT.app
          zip -ry ${{ github.workspace }}/${{ matrix.asset_name }}.zip MARMOT.app

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      # Windows: build MSI only (no NSIS — avoids encoding/language issues)
      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        working-directory: tauri-app
        run: npx tauri build --target ${{ matrix.target }} --bundles msi

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      # Linux: raw binary (no bundle needed)
      - name: Build Tauri app (Linux)
        if: runner.os == 'Linux'
        working-directory: tauri-app
        run: npx tauri build --target ${{ matrix.target }} --no-bundle

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp tauri-app/src-tauri/target/${{ matrix.target }}/release/marmot-gui ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installation

            **macOS**: Download the `.zip` for your architecture, unzip, then **right-click** the app and choose **Open** (required on first launch for unsigned apps). If you see "damaged" instead, run in Terminal: `xattr -cr MARMOT.app`

            **Windows**: Download and run the `.msi` installer.

            **Linux**: Extract the `.tar.gz` and run `./marmot-gui`.
