name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine MARMOT_REF
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: use the tag name (e.g. v0.4.0)
            echo "marmot_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: use the input ref or default
            echo "marmot_ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/peterleary/marmot
          tags: |
            # On v* tag push: 0.4.0, 0.4, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # On manual dispatch: dev
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MARMOT_REF=${{ steps.ref.outputs.marmot_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
