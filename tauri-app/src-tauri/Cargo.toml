[package]
name = "marmot-gui"
version = "1.3.0"
description = "MARMOT Pipeline Desktop GUI"
authors = ["Peter Leary"]
edition = "2021"

[lib]
name = "marmot_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.26"
rust_xlsxwriter = "0.82"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true
