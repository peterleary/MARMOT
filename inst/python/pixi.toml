# The Python environment for the original PARC and PaCMAP, built by pixi from
# conda-forge with ready-made packages (nothing is compiled). The versions are
# those of environment.yml, which MARMOT's results were checked against.
[workspace]
name = "marmot-python"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.9.*"
numpy = "==1.22.3"
scikit-learn = "==1.0.2"
python-annoy = "==1.17.3"
numba = "==0.60.0"
llvmlite = "==0.43.0"
python-igraph = "==0.11.6"
leidenalg = "==0.10.2"
hnswlib = "==0.8.0"

[pypi-dependencies]
pacmap = "==0.8.0"
parc = "==0.40"
