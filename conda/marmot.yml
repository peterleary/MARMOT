name: marmot-env
channels:
  - conda-forge
  - bioconda
  - r
  - defaults

dependencies:
  - libgit2
  - curl
  - openssl
  - pkg-config
  - git
  - r-base>=4.3
  - r-pak
  - r-devtools
  - r-usethis
  - r-roxygen2
  - r-matrix
  - r-rcpp
  # Python packages (if needed for interoperability)
  - pip
